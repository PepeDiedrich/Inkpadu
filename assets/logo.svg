<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <!-- Chromatische Hochfrequenz-Definition -->
        <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        <!-- Diffuse Luminanz-Matrix -->
        <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- AI Funke: Perfekte Kreisgeometrie verschmilzt mit Rotationssymmetrie -->
    <circle cx="50" cy="20" r="7" fill="url(#primaryGradient)" filter="url(#subtleGlow)"/>
    <path d="M50,5 L50,10 M50,30 L50,35 M35,20 L40,20 M60,20 L65,20" stroke="url(#primaryGradient)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Stamm: Hyperellipse, annähernd durch hochpräzise kubische Vektoren -->
    <path d="M43,45 C43,40 57,40 57,45 C57,65 52,88 50,92 C48,88 43,65 43,45 Z" fill="url(#primaryGradient)"/>
</svg>
